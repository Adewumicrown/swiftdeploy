services:
  image: swift-deploy-1-node:latest
  port: 3000
  mode: stable
  version: "1.0.0"

nginx:
  image: nginx:latest
  port: 8080
  proxy_timeout: 30

opa:
  image: openpolicyagent/opa:latest
  port: 8181

network:
  name: swiftdeploy-net
  driver_type: bridge

restart_policy: unless-stopped

volumes:
  logs: app-logs

thresholds:
  min_disk_free_gb: 10.0
  max_cpu_load: 2.0
  min_mem_available_pct: 10.0
  max_error_rate_pct: 1.0
  max_p99_latency_ms: 500.0
